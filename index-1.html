  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <link rel="manifest" href="manifest.json" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />

<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

// ── Storage (localStorage for standalone PWA) ────────────────────────────────
const STORAGE_KEY = "kensetsu1k_v2";
const defaultData = { questions: [], sessions: [], lastStudyDate: null };

function loadData() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaultData; }
  catch { return defaultData; }
}
function saveData(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {}
}

// ── Constants ────────────────────────────────────────────────────────────────

  .cat-bar-wrap { flex:1; height:8px; background:#e8e5e0; border-radius:4px; overflow:hidden; }
  .cat-bar { height:100%; border-radius:4px; transition:width .6s ease; }
  .cat-pct { font-size:11px; color:${SUBTEXT}; width:34px; text-align:right; }
  .ai-messages { display:flex; flex-direction:column; gap:12px; max-height:380px; overflow-y:auto; margin-bottom:14px; }
  .ai-msg { padding:12px 14px; border-radius:10px; font-size:13px; line-height:1.7; }
  .ai-msg.user { background:rgba(232,100,42,.08); border:1px solid rgba(232,100,42,.2); align-self:flex-end; max-width:85%; }
  .ai-msg.assistant { background:${INBG}; border:1px solid ${BORDER}; align-self:flex-start; max-width:90%; white-space:pre-wrap; }

  .empty .big { font-size:38px; margin-bottom:10px; }
  .tag { display:inline-flex; align-items:center; padding:2px 8px; border-radius:4px;
    font-size:11px; background:#f0ede8; color:${SUBTEXT}; border:1px solid ${BORDER}; }
  .toast { position:fixed; bottom:24px; right:16px; left:16px; background:#fff; border:1px solid ${BORDER};
    border-radius:10px; padding:12px 16px; font-size:13px; z-index:9999;
    animation:slideIn .3s ease; box-shadow:0 8px 24px rgba(0,0,0,.12); color:${TEXT}; text-align:center; }
  .toast.success { border-color:#10b981; color:#059669; }
  .toast.error { border-color:#ef4444; color:#dc2626; }
  @keyframes slideIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  .pwa-banner { background:#fff3e0; border:1px solid #ffcc80; border-radius:10px; padding:12px 16px;
    font-size:12px; color:#e65100; margin-bottom:16px; line-height:1.6; }

// ── Toast ────────────────────────────────────────────────────────────────────
function Toast({ msg, type, onDone }) {
  useEffect(() => { const t = setTimeout(onDone, 2800); return () => clearTimeout(t); }, []);
  return <div className={`toast ${type}`}>{msg}</div>;
}

// ── PWA Install Banner ───────────────────────────────────────────────────────
function PWABanner() {
  const [show, setShow] = useState(false);
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isAndroid = /android/i.test(navigator.userAgent);
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

  useEffect(() => {
    if (!isStandalone && (isIOS || isAndroid)) setShow(true);
  }, []);

  if (!show) return null;
  return (
    <div className="pwa-banner">
      📱 <strong>ホーム画面に追加できます！</strong><br/>
      {isIOS ? "SafariでこのページのURL → 「共有」→「ホーム画面に追加」" : "Chrome → メニュー(⋮) → 「アプリをインストール」または「ホーム画面に追加」"}
      <button onClick={() => setShow(false)} style={{float:"right",border:"none",background:"transparent",color:"#e65100",cursor:"pointer",fontSize:16}}>×</button>
    </div>
  );
}

// ── Photo Scanner ────────────────────────────────────────────────────────────
function PhotoScanner({ onExtracted, toast }) {
  const [imgData, setImgData] = useState(null);
  const [scanning, setScanning] = useState(false);
  const [dragging, setDragging] = useState(false);
  const fileRef = useRef();
  const galleryRef = useRef();

  const handleFile = (file) => {
    if (!file || !file.type.startsWith("image/")) return toast("画像ファイルを選択してください", "error");
    const reader = new FileReader();
    reader.onload = (e) => setImgData(e.target.result);
    reader.readAsDataURL(file);
  };

  const scan = async () => {
    if (!imgData) return;
    setScanning(true);
    try {
      const base64 = imgData.split(",")[1];
      const mediaType = imgData.split(";")[0].split(":")[1];
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514", max_tokens: 1000,
          messages: [{ role: "user", content: [
            { type: "image", source: { type: "base64", media_type: mediaType, data: base64 } },
            { type: "text", text: `この画像は一級建築施工管理技士の過去問テキスト（TAC出版）のページです。
以下のJSON形式で問題を抽出してください。JSONのみ返してください（説明文・コードブロック不要）:
{"text":"問題文","choices":["選択肢1","選択肢2","選択肢3","選択肢4"],"answer":0,"note":"解説（なければ空文字）","category":"建築学 or 施工管理 or 法規 or 躯体工事 or 仕上工事 or 施工計画 or 工程管理 or 品質管理 or 安全管理"}
answerは0〜3のインデックス。問題が複数あれば最初の1問のみ。読み取れない場合は{"error":"読み取れませんでした"}` }
          ]}],
        }),
      });
      const d = await res.json();
      const raw = d.content?.map(c => c.text||"").join("") || "";
      const parsed = JSON.parse(raw.replace(/```json|```/g,"").trim());
      if (parsed.error) { toast("読み取れませんでした。写真を撮り直してください", "error"); }
      else { onExtracted(parsed); toast("読み取り完了！内容を確認してください ✓", "success"); setImgData(null); }
    } catch { toast("読み取りに失敗しました", "error"); }
    setScanning(false);
  };

  return (
    <>
      {/* カメラ専用 */}
      <input ref={fileRef} type="file" accept="image/*" capture="environment"
        style={{display:"none"}} onChange={e => handleFile(e.target.files[0])} />
      {/* ファイル選択専用 */}
      <input ref={galleryRef} type="file" accept="image/*"
        style={{display:"none"}} onChange={e => handleFile(e.target.files[0])} />
      {!imgData ? (
        <div>
          <div style={{display:"flex",gap:10,marginBottom:12}}>
            <button className="btn btn-primary" style={{flex:1,justifyContent:"center",padding:"16px 8px",fontSize:14}}
              onClick={() => fileRef.current.click()}>
              <span style={{fontSize:24,display:"block",marginBottom:4}}>📷</span>
              カメラで撮影
            </button>
            <button className="btn btn-ghost" style={{flex:1,justifyContent:"center",padding:"16px 8px",fontSize:14,border:`2px solid ${BORDER}`}}
              onClick={() => galleryRef.current.click()}>
              <span style={{fontSize:24,display:"block",marginBottom:4}}>🖼️</span>
              ファイルから選択
            </button>
          </div>
          <div className={`photo-zone ${dragging?"dragging":""}`} style={{padding:"16px",marginBottom:0}}
            onDragOver={e=>{e.preventDefault();setDragging(true)}}
            onDragLeave={()=>setDragging(false)}
            onDrop={e=>{e.preventDefault();setDragging(false);handleFile(e.dataTransfer.files[0])}}>
            <div style={{fontSize:12,color:SUBTEXT}}>またはここに画像をドラッグ＆ドロップ</div>
          </div>
        </div>
      ) : (
        <>
          <img src={imgData} alt="preview" className="photo-preview" />
          <div style={{display:"flex",gap:8}}>
            <button className="btn btn-primary" onClick={scan} disabled={scanning} style={{flex:1}}>
              {scanning ? "🔍 AIが読み取り中…" : "🔍 AIで問題を読み取る"}
            </button>
            <button className="btn btn-ghost" onClick={()=>setImgData(null)}>やり直す</button>
          </div>
        </>
      )}
      <p className="hint" style={{marginTop:10}}>※ AIが問題文・選択肢・正解・分野を自動認識。読み取り後に確認・修正できます。</p>
    </>
  );
}

// ── RegisterTab ──────────────────────────────────────────────────────────────
function RegisterTab({ data, setData, toast }) {
  const empty = { category: CATEGORIES[0], text: "", choices: ["","","",""], answer: 0, note: "" };
  const [form, setForm] = useState(empty);
  const [mode, setMode] = useState("photo");
  const set = (k,v) => setForm(f=>({...f,[k]:v}));
  const setChoice = (i,v) => setForm(f=>{const c=[...f.choices];c[i]=v;return{...f,choices:c}});
  const handleExtracted = (p) => {
    setForm({ category: CATEGORIES.includes(p.category)?p.category:CATEGORIES[0],
      text:p.text||"", choices:Array.isArray(p.choices)&&p.choices.length===4?p.choices:["","","",""],
      answer:typeof p.answer==="number"?p.answer:0, note:p.note||"" });
    setMode("confirm");
  };
  const submit = async () => {
    if (!form.text.trim()) return toast("問題文を入力してください","error");
    if (form.choices.some(c=>!c.trim())) return toast("選択肢をすべて入力してください","error");
    const q = {id:Date.now(), addedAt:new Date().toISOString(), ...form};
    const next = {...data, questions:[...data.questions, q]};
    saveData(next); setData(next); setForm(empty); setMode("photo");
    toast("問題を登録しました ✓","success");
  };
  const FormBody = () => (
    <>
      <div className="form-group">
        <label className="label">分野</label>
        <select className="select" value={form.category} onChange={e=>set("category",e.target.value)}>
          {CATEGORIES.map(c=><option key={c}>{c}</option>)}
        </select>
      </div>
      <div className="form-group">
        <label className="label">問題文</label>
        <textarea className="textarea" style={{minHeight:100}} value={form.text}
          onChange={e=>set("text",e.target.value)} placeholder="問題文を入力…"/>
      </div>
      <div className="form-group">
        <label className="label">選択肢（正解のボタンをタップ）</label>
        {form.choices.map((c,i)=>(
          <div className="choice-row" key={i}>
            <button className={`choice-letter ${form.answer===i?"correct":""}`} onClick={()=>set("answer",i)}>
              {["ア","イ","ウ","エ"][i]}
            </button>
            <input className="input" value={c} onChange={e=>setChoice(i,e.target.value)}
              placeholder={`選択肢${["ア","イ","ウ","エ"][i]}`}/>
          </div>
        ))}
        <p className="hint">✅ 正解: {["ア","イ","ウ","エ"][form.answer]}</p>
      </div>
      <div className="form-group">
        <label className="label">解説メモ（任意）</label>
        <textarea className="textarea" value={form.note} onChange={e=>set("note",e.target.value)} placeholder="テキストの解説や自分のメモ…"/>
      </div>
      <div style={{display:"flex",gap:8}}>
        <button className="btn btn-primary" onClick={submit}>登録する</button>
        <button className="btn btn-ghost" onClick={()=>{setForm(empty);setMode("photo");}}>キャンセル</button>
      </div>
    </>
  );
  return (
    <div>
      <div className="card">
        <div className="card-title">📝 問題を登録</div>
        <div className="inner-tabs">
          <button className={`inner-tab ${mode==="photo"?"active":""}`} onClick={()=>setMode("photo")}>📷 写真から登録</button>
          <button className={`inner-tab ${mode==="manual"?"active":""}`} onClick={()=>setMode("manual")}>✍️ 手入力</button>
          {mode==="confirm"&&<button className="inner-tab active">✅ 内容確認・修正</button>}
        </div>
        {mode==="photo" && <PhotoScanner onExtracted={handleExtracted} toast={toast}/>}
        {(mode==="manual"||mode==="confirm") && (
          <>
            {mode==="confirm"&&<div style={{background:"#f0fdf4",border:"1px solid #bbf7d0",borderRadius:10,padding:"10px 14px",marginBottom:16,fontSize:13,color:"#166534"}}>✅ AIが読み取りました。内容を確認・修正してから登録してください。</div>}
            <FormBody/>
          </>
        )}
      </div>
      <div className="card">
        <div className="card-title">📚 登録済み問題 ({data.questions.length}問)</div>
        {data.questions.length===0
          ? <div className="empty"><div className="big">📖</div>まだ問題が登録されていません</div>
          : [...data.questions].reverse().map(q=>(
            <div key={q.id} style={{padding:"12px 0",borderBottom:`1px solid ${BORDER}`}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                <span className="tag">{q.category}</span>
                <button className="btn btn-danger btn-sm" onClick={()=>{
                  const next={...data,questions:data.questions.filter(x=>x.id!==q.id)};
                  saveData(next);setData(next);
                }}>削除</button>
              </div>
              <div style={{fontSize:13,color:TEXT,lineHeight:1.6}}>{q.text}</div>
            </div>
          ))
        }
      </div>
    </div>
  );
}

// ── QuizTab ──────────────────────────────────────────────────────────────────
function QuizTab({ data, setData, toast }) {
  const [phase, setPhase] = useState("select");
  const [filterCat, setFilterCat] = useState("すべて");
  const [filterCount, setFilterCount] = useState(10);
  const [questions, setQuestions] = useState([]);
  const [idx, setIdx] = useState(0);
  const [chosen, setChosen] = useState(null);
  const [revealed, setRevealed] = useState(false);
  const [results, setResults] = useState([]);
  const pool = filterCat==="すべて"?data.questions:data.questions.filter(q=>q.category===filterCat);
  const startQuiz = () => {
    if (pool.length===0) return toast("問題がありません。先に登録してください","error");
    const q=[...pool].sort(()=>Math.random()-.5).slice(0,Math.min(filterCount,pool.length));
    setQuestions(q);setIdx(0);setChosen(null);setRevealed(false);setResults([]);setPhase("quiz");
  };
  const choose = (i) => { if(chosen!==null)return; setChosen(i);setRevealed(true); };
  const next = () => {
    const correct=chosen===questions[idx].answer;
    const nr=[...results,{qid:questions[idx].id,correct}];
    setResults(nr);
    if(idx+1>=questions.length){
      const session={date:new Date().toDateString(),results:nr};
      const nxt={...data,sessions:[...data.sessions,session],lastStudyDate:new Date().toDateString()};
      saveData(nxt);setData(nxt);setPhase("result");
    } else { setIdx(i=>i+1);setChosen(null);setRevealed(false); }
  };
  if(phase==="select") return (
    <div className="card">
      <div className="card-title">🎯 復習クイズ設定</div>
      {data.questions.length===0
        ? <div className="empty"><div className="big">📖</div>問題を登録してからクイズを始めましょう</div>
        : <>
          <div className="form-group">
            <label className="label">分野フィルター</label>
            <select className="select" value={filterCat} onChange={e=>setFilterCat(e.target.value)}>
              <option>すべて</option>{CATEGORIES.map(c=><option key={c}>{c}</option>)}
            </select>
          </div>
          <div className="form-group">
            <label className="label">出題数（対象: {pool.length}問）</label>
            <select className="select" value={filterCount} onChange={e=>setFilterCount(Number(e.target.value))}>
              {[5,10,15,20,30].map(n=><option key={n} value={n}>{n}問</option>)}
            </select>
          </div>
          <button className="btn btn-primary" onClick={startQuiz}>クイズ開始 →</button>
        </>
      }
    </div>
  );
  if(phase==="result"){
    const correct=results.filter(r=>r.correct).length;
    const pct=Math.round(correct/results.length*100);
    return (
      <div className="card">
        <div className="card-title">🏆 結果</div>
        <div className="result-circle"><div className="result-pct">{pct}%</div><div className="result-label">正答率</div></div>
        <div style={{textAlign:"center",color:SUBTEXT,marginBottom:20,fontSize:14}}>{results.length}問中 {correct}問正解</div>
        <div style={{display:"flex",justifyContent:"center"}}>
          <button className="btn btn-primary" onClick={()=>setPhase("select")}>もう一度</button>
        </div>
      </div>
    );
  }
  const q=questions[idx]; const letters=["ア","イ","ウ","エ"];
  return (
    <div className="card">
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
        <span className="tag">{q.category}</span>
        <span style={{fontSize:12,color:SUBTEXT}}>{idx+1} / {questions.length}</span>
      </div>
      <div className="quiz-progress"><div className="quiz-progress-bar" style={{width:`${(idx/questions.length)*100}%`}}/></div>
      <div className="quiz-question">{q.text}</div>
      <div className="quiz-choices">
        {q.choices.map((c,i)=>{
          let cls="quiz-choice";
          if(revealed){
            if(i===q.answer) cls+=" reveal-correct";
            if(i===chosen&&chosen!==q.answer) cls+=" selected-wrong";
            if(i===chosen&&chosen===q.answer) cls="quiz-choice selected-correct";
          }
          return (
            <button key={i} className={cls} disabled={revealed} onClick={()=>choose(i)}>
              <span style={{fontWeight:700,flexShrink:0,color:SUBTEXT}}>{letters[i]}.</span>
              <span>{c}</span>
            </button>
          );
        })}
      </div>
      {revealed&&(
        <div style={{marginBottom:16}}>
          <div style={{marginBottom:8}}>
            <span className={`quiz-badge ${chosen===q.answer?"badge-correct":"badge-wrong"}`}>
              {chosen===q.answer?"✓ 正解！":"✗ 不正解"}
            </span>
            {chosen!==q.answer&&<span style={{fontSize:13,color:"#059669",marginLeft:8}}>正解: {letters[q.answer]}</span>}
          </div>
          {q.note&&<div style={{background:"#f0f7ff",borderRadius:8,padding:12,fontSize:13,lineHeight:1.7,color:"#1e3a5f",border:"1px solid #bfdbfe"}}>💡 {q.note}</div>}
        </div>
      )}
      {revealed&&<button className="btn btn-primary" onClick={next}>{idx+1>=questions.length?"結果を見る":"次の問題 →"}</button>}
    </div>
  );
}

// ── ProgressTab ──────────────────────────────────────────────────────────────
function ProgressTab({ data }) {
  const sessions=data.sessions;
  const totalQ=sessions.reduce((s,ss)=>s+ss.results.length,0);
  const totalC=sessions.reduce((s,ss)=>s+ss.results.filter(r=>r.correct).length,0);
  const streak=(()=>{
    const dates=[...new Set(sessions.map(s=>s.date))].sort((a,b)=>new Date(b)-new Date(a));
    let s=0,d=new Date();d.setHours(0,0,0,0);
    for(const dt of dates){if(new Date(dt).toDateString()===d.toDateString()){s++;d.setDate(d.getDate()-1);}else break;}
    return s;
  })();
  const catStats={};
  CATEGORIES.forEach(c=>catStats[c]={total:0,correct:0});
  sessions.forEach(ss=>ss.results.forEach(r=>{
    const q=data.questions.find(q=>q.id===r.qid);
    if(q&&catStats[q.category]){catStats[q.category].total++;if(r.correct)catStats[q.category].correct++;}
  }));
  const last14=Array.from({length:14},(_,i)=>{
    const d=new Date();d.setDate(d.getDate()-13+i);
    const ds=d.toDateString();
    const ss=sessions.filter(s=>s.date===ds);
    return{label:`${d.getMonth()+1}/${d.getDate()}`,total:ss.reduce((s,x)=>s+x.results.length,0)};
  });
  const maxTotal=Math.max(...last14.map(d=>d.total),1);
  return (
    <div>
      <div className="stats-grid">
        <div className="stat-box"><div className="stat-val">{sessions.length}</div><div className="stat-lbl">セッション数</div></div>
        <div className="stat-box"><div className="stat-val">{totalQ}</div><div className="stat-lbl">累計解答数</div></div>
        <div className="stat-box"><div className="stat-val">{totalQ?Math.round(totalC/totalQ*100):0}%</div><div className="stat-lbl">累計正答率</div></div>
        <div className="stat-box"><div className="stat-val">{streak}</div><div className="stat-lbl">連続学習🔥</div></div>
      </div>
      <div className="card">
        <div className="card-title">📊 過去14日間の学習量</div>
        {last14.every(d=>d.total===0)
          ?<div className="empty">クイズを解くとグラフが表示されます</div>
          :<div style={{display:"flex",alignItems:"flex-end",gap:4,height:90}}>
            {last14.map((d,i)=>(
              <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3,height:"100%"}}>
                <div style={{flex:1,display:"flex",alignItems:"flex-end",width:"100%"}}>
                  <div style={{width:"100%",height:d.total?`${Math.max(10,(d.total/maxTotal)*100)}%`:"2px",
                    background:d.total?ACCENT:"#e8e5e0",borderRadius:"4px 4px 0 0",transition:"height .4s"}}/>
                </div>
                <div style={{fontSize:8,color:SUBTEXT,writingMode:"vertical-rl",transform:"rotate(180deg)"}}>{d.label}</div>
              </div>
            ))}
          </div>
        }
      </div>
      <div className="card">
        <div className="card-title">🎯 分野別正答率</div>
        {CATEGORIES.map(cat=>{
          const s=catStats[cat];
          const pct=s.total?Math.round(s.correct/s.total*100):null;
          const color=pct===null?"#e8e5e0":pct>=70?"#10b981":pct>=50?"#f59e0b":"#ef4444";
          return(
            <div className="cat-row" key={cat}>
              <div className="cat-name">{cat}</div>
              <div className="cat-bar-wrap"><div className="cat-bar" style={{width:pct!==null?`${pct}%`:"0%",background:color}}/></div>
              <div className="cat-pct">{pct!==null?`${pct}%`:"—"}</div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── AITab ────────────────────────────────────────────────────────────────────
function AITab() {
  const [messages,setMessages]=useState([{role:"assistant",content:"こんにちは！一級建築施工管理技士の学習をサポートします。\n問題文を貼り付けたり、わからない用語・概念を質問してみてください。"}]);
  const [input,setInput]=useState("");
  const [loading,setLoading]=useState(false);
  const send=useCallback(async()=>{
    const text=input.trim(); if(!text||loading)return;
    const history=[...messages,{role:"user",content:text}];
    setMessages(history);setInput("");setLoading(true);
    try{
      const res=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,
          system:"あなたは一級建築施工管理技士試験の専門家講師です。受験生の質問にわかりやすく丁寧な日本語で解説してください。問題文が貼られたら正解と詳しい解説を提供してください。用語の質問には定義と試験でのポイントを説明してください。苦手分野には覚え方のコツも教えてください。",
          messages:history.map(m=>({role:m.role,content:m.content}))})});
      const d=await res.json();
      const reply=d.content?.map(c=>c.text||"").join("")||"エラーが発生しました。";
      setMessages(m=>[...m,{role:"assistant",content:reply}]);
    }catch{setMessages(m=>[...m,{role:"assistant",content:"通信エラーが発生しました。"}]);}
    setLoading(false);
  },[input,messages,loading]);
  return(
    <div className="card">
      <div className="card-title">🤖 AI解説チャット</div>
      <div className="ai-messages">
        {messages.map((m,i)=><div key={i} className={`ai-msg ${m.role}`}>{m.content}</div>)}
        {loading&&<div className="ai-msg assistant loading">解説を生成中…</div>}
      </div>
      <div className="ai-input-row">
        <input className="input" value={input} onChange={e=>setInput(e.target.value)}
          onKeyDown={e=>e.key==="Enter"&&!e.shiftKey&&send()}
          placeholder="問題文を貼り付けるか、質問を入力…"/>
        <button className="btn btn-primary" onClick={send} disabled={loading||!input.trim()}>送信</button>
      </div>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
const TABS=[{id:"quiz",label:"🎯 クイズ"},{id:"register",label:"📝 登録"},{id:"progress",label:"📊 進捗"},{id:"ai",label:"🤖 AI解説"}];

function App() {
  const [tab,setTab]=useState("quiz");
  const [data,setData]=useState(()=>loadData());
  const [toastMsg,setToastMsg]=useState(null);
  const toast=(msg,type="success")=>setToastMsg({msg,type,key:Date.now()});
  return(
    <>
      <style>{globalCSS}</style>
      <div className="app">
        <nav className="nav">
          <div className="nav-logo">一建施</div>
          {TABS.map(t=><button key={t.id} className={`nav-tab ${tab===t.id?"active":""}`} onClick={()=>setTab(t.id)}>{t.label}</button>)}
        </nav>
        <main className="main">
          <PWABanner/>
          {tab==="quiz"&&<QuizTab data={data} setData={setData} toast={toast}/>}
          {tab==="register"&&<RegisterTab data={data} setData={setData} toast={toast}/>}
          {tab==="progress"&&<ProgressTab data={data}/>}
          {tab==="ai"&&<AITab/>}
        </main>
      </div>
      {toastMsg&&<Toast key={toastMsg.key} msg={toastMsg.msg} type={toastMsg.type} onDone={()=>setToastMsg(null)}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
